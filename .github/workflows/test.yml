name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        term:
          - xterm-256color
          - xterm
          - screen
          - tmux-256color
          - linux
          - rxvt-unicode
          - vt100
          - vt220
          - dumb
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh and terminfo entries
        run: sudo apt-get update && sudo apt-get install -y zsh ncurses-term
      - name: Check syntax
        run: |
          zsh -n zsh-named-keybind.plugin.zsh
          zsh -n tests/key-sequences.zsh
      - name: Run tests
        env:
          TERM: ${{ matrix.term }}
        run: ./tests/run.sh
