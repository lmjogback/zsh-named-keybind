name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check syntax
        run: |
          zsh -n zsh-named-keybind.plugin.zsh
          zsh -n tests/key-sequences.zsh
      - name: Run tests
        env:
          TERM: xterm-256color
        run: ./tests/run.sh
